<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="탐구 질문을 실행 가능한 계획으로 만드는 고1용 탐구 설계 도구"><title>탐구 설계 | 진로 실험실</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar no-print"><div><strong>나의 경험에서 시작하는 진로 실험실</strong><span class="badge">STEP 2 탐구 설계</span></div><div class="top-actions"><button class="ghost" id="printInquiry">설계안 인쇄</button><button class="danger ghost" id="clearFlow">연계 자료 삭제</button></div></header><main class="app-shell flow-shell"><div data-flow-nav></div>
<section class="flow-hero"><p class="eyebrow">학생 성장 로드맵 STEP 2</p><h1>질문을 실행 가능한 탐구로 설계하기</h1><p class="lead">대상·자료·방법·범위·검증을 정해 “할 수 있는 탐구”로 바꿉니다.</p></section><div id="sourceStatus" class="notice info"></div>
<section class="card"><h2>선택한 탐구 질문</h2><label class="field"><textarea id="question" maxlength="350"></textarea></label></section>
<section class="card"><h2>1. 탐구의 목적과 예상</h2><div class="field-grid"><label class="field">이 질문을 탐구하는 이유<textarea id="purpose" maxlength="400"></textarea></label><label class="field">탐구 전 예상<textarea id="expectation" maxlength="400" placeholder="결론을 미리 정하지 말고, 현재 예상과 이유를 적습니다."></textarea></label></div></section>
<section class="card"><h2>2. 자료와 방법 매칭</h2><div id="methodCards" class="choice-grid three compact"></div><div class="notice info" id="methodGuide"></div></section>
<section class="card"><h2>3. 구체적인 실행 계획</h2><div class="field-grid"><label class="field">탐구 대상<input id="target" maxlength="120"></label><label class="field">자료 출처·수집 방법<textarea id="sources" maxlength="500"></textarea></label><label class="field">분석·실행 절차<textarea id="procedure" maxlength="600" placeholder="1. 자료 선정 2. 기준 설정 3. 비교·분석 4. 결과 정리처럼 적습니다."></textarea></label><label class="field">역할과 협업<textarea id="roles" maxlength="350" placeholder="개인 탐구면 내가 맡을 일을 적습니다."></textarea></label><label class="field">기간과 일정<textarea id="schedule" maxlength="350"></textarea></label><label class="field">예상 결과물<select id="output"><option>탐구 보고서</option><option>인포그래픽</option><option>발표 자료</option><option>데이터 표·그래프</option><option>모형·프로토타입</option><option>영상·카드뉴스</option><option>기타</option></select></label></div></section>
<section class="card"><h2>4. 근거와 검증</h2><div class="field-grid"><label class="field">판단 기준<textarea id="criteria" maxlength="400" placeholder="무엇을 근거로 결론을 내릴지 적습니다."></textarea></label><label class="field">신뢰도를 높이는 방법<textarea id="verification" maxlength="400" placeholder="출처 비교, 표본 확대, 반복 측정, 피드백, 반례 검토 등"></textarea></label><label class="field">한계와 주의점<textarea id="limits" maxlength="400"></textarea></label><label class="field">윤리·개인정보 점검<textarea id="ethics" maxlength="400" placeholder="동의, 익명 처리, 저작권, 안전 문제를 점검합니다."></textarea></label></div></section>
<section class="card"><h2>5. 실행 가능성 점검</h2><div class="check-grid"><label><input type="checkbox" id="cTime"> 정해진 기간 안에 가능하다</label><label><input type="checkbox" id="cData"> 실제로 구할 수 있는 자료가 있다</label><label><input type="checkbox" id="cMethod"> 질문과 방법이 연결된다</label><label><input type="checkbox" id="cEthics"> 개인정보·동의·안전을 확인했다</label><label><input type="checkbox" id="cRevise"> 결과가 예상과 달라도 수정·설명할 수 있다</label></div><div class="button-row no-print"><button id="saveInquiry">설계 저장</button><button class="secondary" id="copyInquiry">설계안 복사</button><button id="goRoadmap">성장 로드맵으로 이동</button></div><p id="inquiryMessage" class="help"></p></section>
<section class="card print-only inquiry-print"><h2>탐구 설계 요약</h2><div id="printSummary" class="summary-card"></div></section></main><footer class="no-print"><p>탐구 중 더 적절한 자료나 방법을 발견하면 설계를 수정하세요.</p></footer><script src="flow-common.js"></script><script src="inquiry.js"></script></body></html>
